<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organigrama DNA de Investigación y Desarrollo - INTA</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 0;
    }

    /* Transiciones suaves para acordeón de integrantes */
    .accordion-content {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.32s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease;
      opacity: 0;
    }

    .org-card.is-open .accordion-content {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .accordion-inner {
      overflow: hidden;
    }

    .chevron-icon {
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .org-card.is-open .chevron-icon {
      transform: rotate(180deg);
    }

    /* Sombra y elevación institucional */
    .org-card {
      transition: transform 0.2s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .org-card:hover {
      box-shadow: 0 10px 25px -5px rgba(0, 90, 156, 0.14), 0 4px 10px -2px rgba(0, 58, 102, 0.08);
    }

    /* Toast de notificación de copiado */
    @keyframes slideUpFade {
      0% { opacity: 0; transform: translateY(12px); }
      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-8px); }
    }

    .toast-animate {
      animation: slideUpFade 2.2s ease forwards;
    }
  </style>
</head>
<body class="antialiased selection:bg-[#005A9C] selection:text-white">

  <!-- Contenedor Principal -->
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">

    <!-- Lienzo del Organigrama con Conectores SVG Dinámicos -->
    <main id="org-canvas" class="relative">
      <!-- Capa SVG para líneas ortogonales exactas en escritorio -->
      <svg id="connector-svg" class="hidden lg:block absolute inset-0 w-full h-full pointer-events-none z-0" aria-hidden="true"></svg>

      <!-- Nivel 1: Nodo Raíz (DNA de Investigación y Desarrollo) -->
      <div class="relative z-10 flex justify-center mb-8 lg:mb-14">
        <div id="node-dna" class="w-full max-w-md"></div>
      </div>

      <!-- Nivel 2 y 3: Tres Columnas según diagrama institucional -->
      <div class="relative z-10 grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-7 items-start">

        <!-- Columna 1: Gerencia de Fortalecimiento + Referente de Calidad Transversal -->
        <div class="flex flex-col gap-6 lg:gap-12">
          <div id="node-fortalecimiento" class="w-full"></div>

          <!-- Sub-nivel conectado bajo Fortalecimiento -->
          <div class="relative pl-5 lg:pl-0 border-l-2 border-[#005A9C]/30 lg:border-l-0">
            <div id="node-calidad" class="w-full"></div>
          </div>
        </div>

        <!-- Columna 2: Gerencia de Articulación y Promoción de I+D -->
        <div class="flex flex-col">
          <div id="node-articulacion" class="w-full"></div>
        </div>

        <!-- Columna 3: Coordinación de Financiamiento Extrapresupuestario (descendida visualmente como en el esquema) -->
        <div class="flex flex-col lg:mt-36">
          <div id="node-financiamiento" class="w-full"></div>
        </div>

      </div>
    </main>
  </div>

  <!-- Contenedor de notificación flotante (Toast) -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 pointer-events-none"></div>

  <script>
    /**

    const ORG_DATA = {

          },

        ]
      },

        ]
      },
      articulacion: {
        id: 'card-articulacion',
        title: 'Gerencia de Articulación y Promoción de I+D',
        level: 'Gerencia',
        accentColor: '#005A9C',
        badgeBg: 'bg-[#E8F4FD] text-[#005A9C]',
        borderTop: 'border-t-4 border-t-[#005A9C]',
        members: [
          {

        ]

      calidad: {

      financiamiento: {

        level: 'Coordinación',
        accentColor: '#68A51D',
        badgeBg: 'bg-[#EFF8E3] text-[#457210]',
        borderTop: 'border-t-4 border-t-[#68A51D]',
        members: [
          {
            role: 'Coordinadora',

            email: 'gomez.patricia2@inta.gob.ar',
            featured: true
          },
          {
            role: 'Equipo Técnico',
            name: 'Leonardo Pereira',
            email: 'pereira.leonardo@inta.gob.ar',
            featured: false

          {
            role: 'Equipo Técnico',
            name: 'María Luz Carvajal',
            email: 'carvajal.luz@inta.gob.ar',
            featured: false
          }
        ]
      }
    };

    let allExpanded = false;

    /**
     * Genera las iniciales de un nombre completo para el avatar
     */
    function getInitials(name) {
      return name
        .split(' ')
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0].toUpperCase())
        .join('');
    }

    /**
     * Construye el HTML de cada tarjeta interactiva
     */
    function renderNodeCard(node) {
      const membersHtml = node.members
        .map((m) => {
          const initials = getInitials(m.name);
          const avatarStyle = m.featured
            ? 'bg-[#005A9C] text-white'
            : 'bg-slate-100 text-[#003A66] border border-slate-200';
          const roleBadge = m.featured
            ? `<span class="inline-block text-[11px] font-semibold text-[#005A9C] bg-[#E8F4FD] px-2 py-0.5 rounded-md mb-1">${m.role}</span>`
            : `<span class="block text-[11px] font-medium text-slate-400 mb-0.5">${m.role}</span>`;

          return `
            <div class="p-3 rounded-xl bg-slate-50/90 hover:bg-[#F0F7FF] border border-slate-200/80 transition-colors">
              <div class="flex items-start gap-2.5">
                <div class="w-8 h-8 rounded-lg ${avatarStyle} flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">
                  ${initials}
                </div>
                <div class="min-w-0 flex-1">
                  ${roleBadge}
                  <p class="text-sm font-semibold text-slate-800 leading-snug break-words">${m.name}</p>
                  <div class="mt-1.5 flex items-center justify-between gap-1.5 bg-white border border-slate-200/90 rounded-lg px-2.5 py-1.5">
                    <a
                      href="mailto:${m.email}"
                      title="Enviar correo a ${m.name}"
                      class="text-xs font-medium text-[#005A9C] hover:text-[#003A66] hover:underline truncate flex items-center gap-1.5"
                    >
                      <svg class="w-3.5 h-3.5 shrink-0 text-[#009EE0]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                      </svg>
                      <span class="truncate">${m.email}</span>
                    </a>
                    <button
                      type="button"
                      onclick="copyEmail(event, '${m.email}')"
                      title="Copiar dirección de correo"
                      class="p-1.5 rounded-md text-slate-500 hover:text-[#005A9C] hover:bg-[#E8F4FD] transition-colors shrink-0 cursor-pointer"
                      aria-label="Copiar correo ${m.email}"
                    >
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;
        })
        .join('');

      return `
        <div
          id="${node.id}"
          class="org-card bg-white border border-slate-200 ${node.borderTop} rounded-2xl shadow-sm overflow-hidden"
        >
          <button
            type="button"
            onclick="toggleNode('${node.id}')"
            aria-expanded="false"
            class="w-full text-left px-5 py-4 flex items-center justify-between gap-3 hover:bg-slate-50/70 transition-colors cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-[#005A9C]"
          >
            <div class="space-y-1.5">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full ${node.badgeBg}">
                  ${node.level}
                </span>
                <span class="text-[11px] font-medium text-slate-400">
                  ${node.members.length} ${node.members.length === 1 ? 'integrante' : 'integrantes'}
                </span>
              </div>
              <h2 class="text-base font-bold text-[#003A66] leading-snug">
                ${node.title}
              </h2>
            </div>

            <div class="w-8 h-8 rounded-full bg-slate-100 text-[#005A9C] flex items-center justify-center shrink-0">
              <svg class="chevron-icon w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </button>

          <div class="accordion-content">
            <div class="accordion-inner">
              <div class="px-4 pb-4 pt-1 space-y-2.5 border-t border-slate-100">
                ${membersHtml}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    /**
     * Alterna el estado desplegado/contraído de una tarjeta individual
     */
    function toggleNode(cardId) {
      const card = document.getElementById(cardId);
      if (!card) return;
      const isOpen = card.classList.toggle('is-open');
      const btn = card.querySelector('button[aria-expanded]');
      if (btn) btn.setAttribute('aria-expanded', String(isOpen));

      updateToggleAllButtonState();
      animateConnectorsDuringTransition();
    }

    /**
     * Despliega o contrae todas las tarjetas simultáneamente
     */
    function toggleAllNodes() {
      const cards = document.querySelectorAll('.org-card');
      allExpanded = !allExpanded;

      cards.forEach((card) => {
        if (allExpanded) {
          card.classList.add('is-open');
        } else {
          card.classList.remove('is-open');
        }
        const btn = card.querySelector('button[aria-expanded]');
        if (btn) btn.setAttribute('aria-expanded', String(allExpanded));
      });

      updateToggleAllButtonState();
      animateConnectorsDuringTransition();
    }

    /**
     * Sincroniza la etiqueta del botón "Desplegar todo / Contraer todo"
     */
    function updateToggleAllButtonState() {
      const cards = Array.from(document.querySelectorAll('.org-card'));
      const openCount = cards.filter((c) => c.classList.contains('is-open')).length;
      const label = document.getElementById('label-toggle-all');
      if (!label) return;

      if (openCount === cards.length) {
        allExpanded = true;
        label.textContent = 'Contraer todo';
      } else if (openCount === 0) {
        allExpanded = false;
        label.textContent = 'Desplegar todo';
      }
    }

    /**
     * Copia el correo al portapapeles con compatibilidad total dentro de iframes
     */
    function copyEmail(event, email) {
      event.stopPropagation();

      const textArea = document.createElement('textarea');
      textArea.value = email;
      textArea.style.position = 'fixed';
      textArea.style.left = '-9999px';
      document.body.appendChild(textArea);
      textArea.select();

      let copied = false;
      try {
        copied = document.execCommand('copy');
      } catch (err) {
        copied = false;
      }
      document.body.removeChild(textArea);

      if (!copied && navigator.clipboard) {
        navigator.clipboard.writeText(email).catch(() => {});
      }

      showToast(`Correo copiado: ${email}`);
    }

    /**
     * Muestra notificación elegante de confirmación
     */
    function showToast(message) {
      const container = document.getElementById('toast-container');
      container.innerHTML = `
        <div class="toast-animate flex items-center gap-2.5 bg-[#003A66] text-white text-xs font-medium px-4 py-3 rounded-xl shadow-lg border border-white/10">
          <svg class="w-4 h-4 text-[#78BE20] shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
          <span>${message}</span>
        </div>
      `;
    }

    /**
     * Dibuja los conectores jerárquicos exactos replicando el diagrama institucional
     */
    function drawConnectors() {
      const svg = document.getElementById('connector-svg');
      const canvas = document.getElementById('org-canvas');
      if (!svg || !canvas || window.innerWidth < 1024) {
        if (svg) svg.innerHTML = '';
        return;
      }

      const canvasRect = canvas.getBoundingClientRect();
      const getCoords = (id) => {
        const el = document.getElementById(id);
        if (!el) return null;
        const r = el.getBoundingClientRect();
        return {
          top: r.top - canvasRect.top,
          bottom: r.bottom - canvasRect.top,
          left: r.left - canvasRect.left,
          right: r.right - canvasRect.left,
          centerX: r.left - canvasRect.left + r.width / 2
        };
      };

      const dna = getCoords('card-dna');
      const fort = getCoords('card-fortalecimiento');
      const art = getCoords('card-articulacion');
      const fin = getCoords('card-financiamiento');
      const cal = getCoords('card-calidad');

      if (!dna || !fort || !art || !fin || !cal) return;

      const strokeColor = '#005A9C';
      const strokeWidth = '2';

      // Punto medio vertical entre DNA y las Gerencias superiores
      const busY = dna.bottom + (fort.top - dna.bottom) / 2;

      const paths = [
        // Tronco vertical desde DNA hasta la barra horizontal
        `M ${dna.centerX} ${dna.bottom} L ${dna.centerX} ${busY}`,
        // Barra horizontal distribuidora entre las 3 ramas
        `M ${fort.centerX} ${busY} L ${fin.centerX} ${busY}`,
        // Bajada hacia Gerencia de Fortalecimiento Institucional
        `M ${fort.centerX} ${busY} L ${fort.centerX} ${fort.top}`,
        // Bajada hacia Gerencia de Articulación y Promoción
        `M ${art.centerX} ${busY} L ${art.centerX} ${art.top}`,
        // Bajada larga hacia Coordinación de Financiamiento Extrapresupuestario
        `M ${fin.centerX} ${busY} L ${fin.centerX} ${fin.top}`,
        // Conexión vertical entre Fortalecimiento y Referente de Calidad Transversal
        `M ${fort.centerX} ${fort.bottom} L ${cal.centerX} ${cal.top}`
      ];

      svg.innerHTML = paths
        .map(
          (d) =>
            `<path d="${d}" fill="none" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />`
        )
        .join('');
    }

    /**
     * Mantiene los conectores SVG sincronizados durante la animación CSS del acordeón
     */
    function animateConnectorsDuringTransition() {
      let start = null;
      function step(timestamp) {
        if (!start) start = timestamp;
        drawConnectors();
        if (timestamp - start < 360) {
          requestAnimationFrame(step);
        }
      }
      requestAnimationFrame(step);
    }

    // Inicialización al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('node-dna').innerHTML = renderNodeCard(ORG_DATA.dna);
      document.getElementById('node-fortalecimiento').innerHTML = renderNodeCard(ORG_DATA.fortalecimiento);
      document.getElementById('node-articulacion').innerHTML = renderNodeCard(ORG_DATA.articulacion);
      document.getElementById('node-calidad').innerHTML = renderNodeCard(ORG_DATA.calidad);
      document.getElementById('node-financiamiento').innerHTML = renderNodeCard(ORG_DATA.financiamiento);

      drawConnectors();

      // Observar cambios de tamaño en el contenedor para redibujar líneas
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => drawConnectors());
        ro.observe(document.getElementById('org-canvas'));
      }
    });

    window.addEventListener('resize', drawConnectors);
  </script>
</body>
